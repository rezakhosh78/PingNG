name: Build and Release F-Droid APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'GitHub Release tag (for example v2.3.8-Pi35); source is the ref selected above'
        required: true
        default: 'v2.3.8-Pi35'
        type: string

permissions:
  contents: write

env:
  RELEASE_TITLE: 'PingNG v2.3.8-Pi35'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-release:
    name: Build, sign, and publish F-Droid APKs
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Check out the selected source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid tag name: $TAG_NAME"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing repository secret: $secret_name"
              exit 1
            fi
          done

      - name: Decode and validate release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/pingng-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "KEYSTORE-DIAGNOSTIC-V3"
          keytool -list -keystore "$keystore_path" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"
          echo "KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build F-Droid release APKs
        run: ./gradlew :app:assembleFdroidRelease --no-daemon --stacktrace

      - name: Align, sign, and verify every APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$android_sdk/build-tools/$ANDROID_BUILD_TOOLS"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          mkdir -p release-assets

          mapfile -d '' apk_files < <(find app/build/outputs/apk/fdroid/release -type f -name '*.apk' -print0 | sort -z)
          if [[ "${#apk_files[@]}" -eq 0 ]]; then
            echo 'Gradle did not produce any F-Droid APK.'
            exit 1
          fi

          for apk in "${apk_files[@]}"; do
            aligned="$RUNNER_TEMP/$(basename "$apk").aligned.apk"
            signed="release-assets/$(basename "$apk")"
            "$zipalign" -p -f 4 "$apk" "$aligned"
            "$apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:KEYSTORE_PASSWORD" \
              --key-pass "env:KEY_PASSWORD" \
              --out "$signed" "$aligned"
            "$apksigner" verify --verbose "$signed"
            "$zipalign" -c -P 4 -v 4 "$signed"
          done

          sha256sum release-assets/*.apk > release-assets/SHA256SUMS
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingNG-${{ env.TAG_NAME }}-F-Droid-signed
          path: release-assets/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          ## PingNG v2.3.8-Pi35

          F-Droid flavor, built with Android SDK 35 and signed with the repository release keystore.

          - Application ID: \`com.pingng.android.fdroid\`
          - APK Signature Scheme: APK Signature Scheme v2/v3 (verified by \`apksigner\`)
          - Source ref: \`$GITHUB_REF\`
          - SHA-256 checksums: \`SHA256SUMS\`
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file"
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file"
          fi
